<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>{{ heading }} — GoGlobal</title></head>
<body>
  <h1>{{ heading }}</h1>
  <ul>
    {% for profile in profiles %}
      <li>
        {{ profile.user.email }}
        — <a href="{% url 'exchange:participation_create' profile.user.id %}">создать участие</a>
      </li>
    {% empty %}
      <li>Пока нет студентов. Разошлите коды приглашений.</li>
    {% endfor %}
  </ul>
  <p><a href="{% url 'home' %}">На главную</a></p>
</body>
</html>
