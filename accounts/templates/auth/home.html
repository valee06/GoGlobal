<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>GoGlobal</title></head>
<body>
  <h1>Вы вошли как {{ user.email }} ({{ user.get_role_display }})</h1>
  {% if user.role == "curator" %}
    <p><a href="{% url 'auth:invitations' %}">Приглашения студентов</a></p>
  {% endif %}
  <form method="post" action="{% url 'auth:logout' %}">
    {% csrf_token %}
    <button type="submit">Выйти</button>
  </form>
</body>
</html>
