<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Регистрация — GoGlobal</title></head>
<body>
  <h1>Регистрация</h1>
  {% if form.non_field_errors %}<div class="error">{{ form.non_field_errors }}</div>{% endif %}
  <form method="post" action="{% url 'auth:register_staff' %}">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit">Зарегистрироваться</button>
  </form>
</body>
</html>
